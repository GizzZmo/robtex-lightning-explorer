name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Primary runtime matches package.json engines (>=20)
  PRIMARY_NODE: "20"

jobs:
  # Fast path: install once, typecheck + build + smoke on the supported baseline.
  quality:
    name: Quality (Node ${{ env.PRIMARY_NODE }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify package entrypoints
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/cli.js
          test -f dist/client.js
          test -f dist/schemas.js
          test -f dist/validate.js

      - name: CLI smoke test
        run: |
          node dist/cli.js --help
          node dist/cli.js --version

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Compatibility matrix runs only after quality passes.
  # On PRs: skip extra runtimes (baseline already covered).
  # On main: also verify current Node LTS line (22).
  compatibility:
    name: Compat Node ${{ matrix.node-version }}
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        node-version: [22]
        # Extend when needed, e.g. [22, 24]
        # exclude examples:
        # exclude:
        #   - node-version: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: CLI smoke test
        run: |
          node dist/cli.js --help
          node dist/cli.js --version
